name: Markdown Checks

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".cspell.json"

permissions:
  contents: read

jobs:
  markdown-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install tools
        run: npm install -g markdownlint-cli2 cspell

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md"

      - name: Spell check Markdown
        run: cspell "**/*.md" --no-must-find-files --config .cspell.json