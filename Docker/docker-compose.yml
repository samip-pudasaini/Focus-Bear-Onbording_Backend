services:
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-dev5
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: mysecretpassword
      DATABASE_NAME: postgres
    depends_on:
      - db

  db:
    image: postgres:18
    container_name: postgres-dev5
    environment:
      POSTGRES_PASSWORD: mysecretpassword
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: